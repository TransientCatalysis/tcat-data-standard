[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tcat-data-standard"
dynamic = ["version"]
description = "Schema, validator, and ingestion contract for transient-kinetics and operando-spectroscopy datasets. The definition of a valid dataset for the TransientCatalysis collaboration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DOCS"]
authors = [{ name = "A. J. Medford", email = "ajm@gatech.edu" }]
keywords = ["catalysis", "transient kinetics", "PRBS", "operando spectroscopy", "FAIR", "TRACE-AI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "jsonschema>=4.18",
    "referencing>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tcat-validate = "tcat_data.cli:main"
tcat-spoke = "tcat_data.spoke_cli:main"

[project.urls]
Homepage = "https://github.com/TransientCatalysis/tcat-data-standard"
Issues = "https://github.com/TransientCatalysis/tcat-data-standard/issues"

[tool.setuptools.dynamic]
# One source of truth: the package's own `__version__`, read without importing it.
version = { attr = "tcat_data.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The schema tree is authored at the repository root and shipped as package data,
# so an installed copy validates without needing the checkout. schema.py looks in
# both places.
[tool.setuptools.package-data]
tcat_data = ["_tcat_build.json", "schema/VERSION", "schema/**/*.json", "profiles/**/*.json", "scaffold/**/*", "scaffold/**/*.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
